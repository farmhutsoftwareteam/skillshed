name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint, scan and regression tests
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          status=0; sh scripts/ci.sh "$RUNNER_TEMP/scan.md" || status=$?
          cat "$RUNNER_TEMP/scan.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit $status
