name: sync-vendor

# Weekly: move tracked vendored skills to their upstream ref and open a PR.
# Nothing reaches main without a reviewed merge.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write # report the checks on the pushed commit

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BRANCH: vendor-sync
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull upstream changes
        run: node scripts/sync-vendor.mjs update --summary "$RUNNER_TEMP/summary.md"

      - name: Refresh skill-issue.in catalog
        run: node scripts/refresh-catalog.mjs || echo "catalog refresh failed, keeping the old snapshot"

      - name: Rebuild router index
        run: node scripts/check.mjs --write || true

      - name: Open or update PR
        run: |
          if git diff --quiet; then echo "No upstream changes"; exit 0; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -q -m "Sync vendored skills from upstream"
          sha=$(git rev-parse HEAD)

          # Same checks as check.yml, on the commit about to be pushed.
          ci_status=pass; sh scripts/ci.sh "$RUNNER_TEMP/scan.md" > "$RUNNER_TEMP/ci.txt" 2>&1 || ci_status=FAIL
          git push -f origin "$BRANCH"

          # A PR opened with GITHUB_TOKEN gets a pull_request run of check.yml
          # that waits for approval with no jobs, and a dispatched run isn't
          # listed on the PR. A commit status is, so report the result as one.
          state=success; [ "$ci_status" = FAIL ] && state=failure
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$state" -f context="check (sync)" \
            -f description="scripts/ci.sh: $ci_status" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

          {
            echo "Upstream changes to vendored skills. Review every diff before merging: these files become instructions your agents follow."
            echo
            echo "Ask Claude: \`/core:vet-skill\` on this PR."
            echo
            echo "Before merging, the \`check (sync)\` status on \`$sha\` must be green. A skipped or pending check is not a pass."
            echo
            echo "## Skill changes"
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "## Checks on $sha: $ci_status"
            echo '```'
            cat "$RUNNER_TEMP/ci.txt"
            echo '```'
            echo
            cat "$RUNNER_TEMP/scan.md"
          } > "$RUNNER_TEMP/body.md"

          title="Sync vendored skills"
          [ "$ci_status" = FAIL ] && title="[checks failing] $title"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
